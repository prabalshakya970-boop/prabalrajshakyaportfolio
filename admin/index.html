<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Content Admin | Prabal Raj Shakya</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #ffffff;
    --surface: #f7f8fb;
    --hairline: #e5e7eb;
    --accent: #2563eb;
    --navy: #1c2a6b;
    --ink: #0f172a;
    --muted: #475569;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--navy); color: #fff;
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .bar strong { font-size: 16px; font-weight: 800; }
  .bar .sub { font-size: 12px; color: #c7d2fe; margin-top: 2px; }
  .bar-actions { display: flex; align-items: center; gap: 12px; }
  .wrap { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 96px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    width: min(360px, calc(100% - 32px)); background: var(--canvas); border: 1px solid var(--hairline);
    border-radius: 18px; padding: 32px; box-shadow: 0 20px 50px rgba(15,23,42,.08);
  }
  .login-card h1 { font-size: 19px; margin: 0 0 6px; }
  .login-card p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input[type="password"], input[type="text"], textarea {
    width: 100%; border: 1px solid var(--hairline); border-radius: 10px; padding: 11px 13px;
    font: inherit; font-size: 14px; outline: 0; background: var(--canvas); color: var(--ink);
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn-primary {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 10px; width: 100%;
  }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3);
    font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 999px;
  }
  .btn-save {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    padding: 9px 20px; border-radius: 999px;
  }
  .btn-save:disabled { opacity: .5; cursor: default; }
  .error { color: #dc2626; font-size: 13px; margin-top: 14px; min-height: 1em; }
  .group { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 16px; padding: 24px; margin-bottom: 18px; }
  .group h2 { font-size: 14px; margin: 0 0 18px; color: var(--navy); letter-spacing: -0.01em; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .status-banner {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 14px 30px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  .status-banner.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .status-banner.error-banner { background: #dc2626; }
  .loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }
  .hidden { display: none !important; }

  .richtext-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
  .richtext-toolbar button {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 800;
  }
  .richtext-toolbar button.italic-btn { font-style: italic; }
  .richtext-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .richtext-box {
    border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 13px;
    min-height: 140px; font-size: 14px; line-height: 1.7; outline: 0;
  }
  .richtext-box:focus { border-color: var(--accent); }
  .richtext-box p { margin: 0 0 12px; }
  .richtext-box p:last-child { margin-bottom: 0; }

  .repeater-item {
    border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    background: var(--surface); position: relative;
  }
  .repeater-item .remove-item {
    position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--canvas); border: 1px solid var(--hairline); color: #dc2626; font-size: 14px;
    line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .repeater-item .subfield { margin-bottom: 12px; }
  .repeater-item .subfield:last-child { margin-bottom: 0; }
  .add-item-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed var(--hairline);
    background: transparent; color: var(--accent); font-weight: 700; font-size: 13px;
  }
  .add-item-btn:hover { border-color: var(--accent); background: var(--surface); }
</style>
</head>
<body>

  <div id="loginView" class="login-wrap hidden">
    <div class="login-card">
      <h1>Content Admin</h1>
      <p>Sign in to edit the site's text content.</p>
      <form id="loginForm">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button class="btn-primary" style="margin-top:18px" type="submit" id="loginBtn">Sign In</button>
        <p class="error" id="loginError"></p>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="bar">
      <div>
        <strong>Content Admin</strong>
        <div class="sub">Edits save straight to the live site.</div>
      </div>
      <div class="bar-actions">
        <button class="btn-save" id="saveBtn" type="button">Save Changes</button>
        <button class="btn-ghost" id="logoutBtn" type="button">Log Out</button>
      </div>
    </div>
    <div class="wrap">
      <div id="loadingMsg" class="loading">Loading content…</div>
      <div id="formGroups"></div>
    </div>
  </div>

  <div class="status-banner" id="statusBanner"></div>

<script>
(function () {
  var originalValues = {};
  var fieldMeta = [];
  var controllers = {}; // fieldId -> { getValue() }

  var loginView = document.getElementById('loginView');
  var appView = document.getElementById('appView');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var loginBtn = document.getElementById('loginBtn');
  var formGroups = document.getElementById('formGroups');
  var loadingMsg = document.getElementById('loadingMsg');
  var saveBtn = document.getElementById('saveBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  var statusBanner = document.getElementById('statusBanner');

  function showBanner(text, isError) {
    statusBanner.textContent = text;
    statusBanner.classList.toggle('error-banner', !!isError);
    statusBanner.classList.add('show');
    setTimeout(function () { statusBanner.classList.remove('show'); }, 3200);
  }

  function showLogin(message) {
    appView.classList.add('hidden');
    loginView.classList.remove('hidden');
    loginError.textContent = message || '';
  }

  function showApp() {
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function unescapeHtml(s) {
    return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }

  function parseProcessSteps(html) {
    var re = /<article class="process-step">\s*<h3>([\s\S]*?)<\/h3>\s*<p>([\s\S]*?)<\/p>\s*<\/article>/g;
    var items = [];
    var m;
    while ((m = re.exec(html || ''))) {
      items.push({ title: unescapeHtml(m[1].trim()), desc: unescapeHtml(m[2].trim()) });
    }
    return items;
  }
  function serializeProcessSteps(items) {
    return items.map(function (it) {
      return '<article class="process-step"><h3>' + escapeHtml(it.title) + '</h3><p>' + escapeHtml(it.desc) + '</p></article>';
    }).join('\n          ');
  }

  function parseFaqList(html) {
    var re = /<details class="faq-item">\s*<summary>([\s\S]*?)<\/summary>\s*<p>([\s\S]*?)<\/p>\s*<\/details>/g;
    var items = [];
    var m;
    while ((m = re.exec(html || ''))) {
      items.push({ q: unescapeHtml(m[1].trim()), a: unescapeHtml(m[2].trim()) });
    }
    return items;
  }
  function serializeFaqList(items) {
    return items.map(function (it) {
      return '<details class="faq-item">\n            <summary>' + escapeHtml(it.q) + '</summary>\n            <p>' + escapeHtml(it.a) + '</p>\n          </details>';
    }).join('\n          ');
  }

  function buildRepeater(wrap, items, itemLabels, addLabel, onChange) {
    var listEl = document.createElement('div');
    wrap.appendChild(listEl);

    function renderList() {
      listEl.innerHTML = '';
      items.forEach(function (item, idx) {
        var card = document.createElement('div');
        card.className = 'repeater-item';

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-item';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', function () {
          items.splice(idx, 1);
          renderList();
          onChange();
        });
        card.appendChild(removeBtn);

        itemLabels.forEach(function (fieldDef) {
          var sub = document.createElement('div');
          sub.className = 'subfield';
          var lbl = document.createElement('label');
          lbl.textContent = fieldDef.label;
          sub.appendChild(lbl);
          var input = fieldDef.multiline ? document.createElement('textarea') : document.createElement('input');
          if (!fieldDef.multiline) input.type = 'text';
          input.value = item[fieldDef.key] || '';
          input.addEventListener('input', function () {
            item[fieldDef.key] = input.value;
            onChange();
          });
          sub.appendChild(input);
          card.appendChild(sub);
        });

        listEl.appendChild(card);
      });
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-item-btn';
    addBtn.textContent = addLabel;
    addBtn.addEventListener('click', function () {
      var blank = {};
      itemLabels.forEach(function (f) { blank[f.key] = ''; });
      items.push(blank);
      renderList();
      onChange();
    });
    wrap.appendChild(addBtn);

    renderList();
  }

  function buildRichText(wrap, initialHtml) {
    var toolbar = document.createElement('div');
    toolbar.className = 'richtext-toolbar';
    var boldBtn = document.createElement('button');
    boldBtn.type = 'button';
    boldBtn.textContent = 'B';
    var italicBtn = document.createElement('button');
    italicBtn.type = 'button';
    italicBtn.className = 'italic-btn';
    italicBtn.textContent = 'I';
    toolbar.appendChild(boldBtn);
    toolbar.appendChild(italicBtn);
    wrap.appendChild(toolbar);

    var box = document.createElement('div');
    box.className = 'richtext-box';
    box.contentEditable = 'true';
    box.innerHTML = initialHtml || '';
    wrap.appendChild(box);

    boldBtn.addEventListener('mousedown', function (e) { e.preventDefault(); document.execCommand('bold'); });
    italicBtn.addEventListener('mousedown', function (e) { e.preventDefault(); document.execCommand('italic'); });
    box.addEventListener('focus', function () {
      document.execCommand('defaultParagraphSeparator', false, 'p');
    });

    return box;
  }

  function fieldInputId(id) { return 'field-' + id; }

  function render(fields, values) {
    fieldMeta = fields;
    originalValues = Object.assign({}, values);
    controllers = {};

    var groups = {};
    var order = [];
    fields.forEach(function (f) {
      if (!groups[f.group]) { groups[f.group] = []; order.push(f.group); }
      groups[f.group].push(f);
    });

    formGroups.innerHTML = '';
    order.forEach(function (groupName) {
      var section = document.createElement('div');
      section.className = 'group';
      var h2 = document.createElement('h2');
      h2.textContent = groupName;
      section.appendChild(h2);

      groups[groupName].forEach(function (f) {
        var wrap = document.createElement('div');
        wrap.className = 'field';

        if (f.type === 'text' || f.type === 'textarea') {
          var label = document.createElement('label');
          label.setAttribute('for', fieldInputId(f.id));
          label.textContent = f.label;
          wrap.appendChild(label);

          var input = f.type === 'text' ? document.createElement('input') : document.createElement('textarea');
          if (f.type === 'text') input.type = 'text';
          input.id = fieldInputId(f.id);
          input.value = values[f.id] || '';
          wrap.appendChild(input);
          controllers[f.id] = { getValue: function () { return input.value; } };

        } else if (f.type === 'richtext') {
          var rtLabel = document.createElement('label');
          rtLabel.textContent = f.label;
          wrap.appendChild(rtLabel);
          var box = buildRichText(wrap, values[f.id] || '');
          controllers[f.id] = { getValue: function () { return box.innerHTML; } };

        } else if (f.type === 'repeater-steps') {
          var stepsLabel = document.createElement('label');
          stepsLabel.textContent = f.label;
          wrap.appendChild(stepsLabel);
          var stepItems = parseProcessSteps(values[f.id]);
          buildRepeater(
            wrap,
            stepItems,
            [{ key: 'title', label: 'Title' }, { key: 'desc', label: 'Description', multiline: true }],
            '+ Add Step',
            function () {}
          );
          controllers[f.id] = { getValue: function () { return serializeProcessSteps(stepItems); } };

        } else if (f.type === 'repeater-faq') {
          var faqLabel = document.createElement('label');
          faqLabel.textContent = f.label;
          wrap.appendChild(faqLabel);
          var faqItems = parseFaqList(values[f.id]);
          buildRepeater(
            wrap,
            faqItems,
            [{ key: 'q', label: 'Question' }, { key: 'a', label: 'Answer', multiline: true }],
            '+ Add FAQ',
            function () {}
          );
          controllers[f.id] = { getValue: function () { return serializeFaqList(faqItems); } };
        }

        section.appendChild(wrap);
      });

      formGroups.appendChild(section);
    });

    loadingMsg.classList.add('hidden');
  }

  function collectChangedValues() {
    var changed = {};
    fieldMeta.forEach(function (f) {
      var ctrl = controllers[f.id];
      if (!ctrl) return;
      var val = ctrl.getValue();
      if (val !== (originalValues[f.id] || '')) {
        changed[f.id] = val;
      }
    });
    return changed;
  }

  function loadContent() {
    loadingMsg.classList.remove('hidden');
    loadingMsg.textContent = 'Loading content…';
    formGroups.innerHTML = '';
    fetch('/api/content', { credentials: 'same-origin' })
      .then(function (res) {
        if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
        if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Failed to load content.'); });
        return res.json();
      })
      .then(function (data) {
        showApp();
        render(data.fields, data.values);
      })
      .catch(function (err) {
        if (err.message !== 'unauthenticated') {
          loadingMsg.textContent = 'Failed to load content: ' + err.message;
        }
      });
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    var password = document.getElementById('password').value;
    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password }),
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (r) {
        if (!r.ok) { loginError.textContent = r.data.error || 'Login failed.'; return; }
        document.getElementById('password').value = '';
        loadContent();
      })
      .catch(function () { loginError.textContent = 'Network error, please try again.'; })
      .finally(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      });
  });

  logoutBtn.addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).finally(function () {
      showLogin();
    });
  });

  saveBtn.addEventListener('click', function () {
    var changed = collectChangedValues();
    if (Object.keys(changed).length === 0) {
      showBanner('No changes to save.');
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    fetch('/api/save', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: changed }),
    })
      .then(function (res) {
        if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
        return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Save failed.'); return d; });
      })
      .then(function () {
        Object.keys(changed).forEach(function (id) { originalValues[id] = changed[id]; });
        showBanner('Saved. The site will redeploy in a minute or two.');
      })
      .catch(function (err) {
        if (err.message !== 'unauthenticated') showBanner(err.message, true);
      })
      .finally(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      });
  });

  loadContent();
})();
</script>
</body>
</html>
