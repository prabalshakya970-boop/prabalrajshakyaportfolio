<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Content Admin | Prabal Raj Shakya</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #ffffff;
    --surface: #f7f8fb;
    --hairline: #e5e7eb;
    --accent: #2563eb;
    --navy: #1c2a6b;
    --ink: #0f172a;
    --muted: #475569;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--navy); color: #fff;
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .bar strong { font-size: 16px; font-weight: 800; }
  .bar .sub { font-size: 12px; color: #c7d2fe; margin-top: 2px; }
  .bar-actions { display: flex; align-items: center; gap: 10px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    width: min(360px, calc(100% - 32px)); background: var(--canvas); border: 1px solid var(--hairline);
    border-radius: 18px; padding: 32px; box-shadow: 0 20px 50px rgba(15,23,42,.08);
  }
  .login-card h1 { font-size: 19px; margin: 0 0 6px; }
  .login-card p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input[type="password"], input[type="text"], textarea {
    width: 100%; border: 1px solid var(--hairline); border-radius: 10px; padding: 11px 13px;
    font: inherit; font-size: 14px; outline: 0; background: var(--canvas); color: var(--ink);
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn-primary {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 10px; width: 100%;
  }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3);
    font-weight: 600; font-size: 13px; padding: 8px 16px; border-radius: 999px;
  }
  .btn-save {
    background: var(--accent); color: #fff; font-weight: 700; font-size: 13px;
    padding: 9px 20px; border-radius: 999px;
  }
  .btn-save:disabled { opacity: .5; cursor: default; }
  .error { color: #dc2626; font-size: 13px; margin-top: 14px; min-height: 1em; }
  .hidden { display: none !important; }

  .layout { display: flex; min-height: calc(100vh - 62px); }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--canvas); border-right: 1px solid var(--hairline);
    padding: 18px 12px;
  }
  .sidebar button {
    display: block; width: 100%; text-align: left; background: transparent; border: 0;
    padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted);
    margin-bottom: 2px;
  }
  .sidebar button:hover { background: var(--surface); color: var(--ink); }
  .sidebar button.active { background: var(--accent); color: #fff; }
  .main { flex: 1; min-width: 0; padding: 28px 32px 96px; }
  .main-inner { max-width: 760px; }

  .group { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 16px; padding: 24px; margin-bottom: 18px; }
  .group h2 { font-size: 14px; margin: 0 0 18px; color: var(--navy); letter-spacing: -0.01em; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .status-banner {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 14px 30px rgba(0,0,0,.25); z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
  }
  .status-banner.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .status-banner.error-banner { background: #dc2626; }
  .loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 14px; }

  .richtext-toolbar { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .richtext-toolbar button {
    height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 800;
  }
  .richtext-toolbar button.italic-btn { font-style: italic; }
  .richtext-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .richtext-box {
    border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 13px;
    min-height: 140px; font-size: 14px; line-height: 1.7; outline: 0;
  }
  .richtext-box.large { min-height: 420px; }
  .richtext-box:focus { border-color: var(--accent); }
  .richtext-box p { margin: 0 0 12px; }
  .richtext-box h2 { font-size: 20px; margin: 20px 0 8px; }
  .richtext-box h3 { font-size: 16px; margin: 16px 0 6px; }
  .richtext-box ul, .richtext-box ol { margin: 0 0 12px; padding-left: 20px; }
  .richtext-box p:last-child { margin-bottom: 0; }

  .repeater-item {
    border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; margin-bottom: 12px;
    background: var(--surface); position: relative;
  }
  .repeater-item .remove-item {
    position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--canvas); border: 1px solid var(--hairline); color: #dc2626; font-size: 14px;
    line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .repeater-item .subfield { margin-bottom: 12px; }
  .repeater-item .subfield:last-child { margin-bottom: 0; }
  .add-item-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed var(--hairline);
    background: transparent; color: var(--accent); font-weight: 700; font-size: 13px;
  }
  .add-item-btn:hover { border-color: var(--accent); background: var(--surface); }

  .image-card { display: flex; gap: 18px; align-items: center; }
  .image-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; border: 1px solid var(--hairline); background: var(--surface); }
  .image-card .image-meta { flex: 1; min-width: 0; }
  .image-card .image-status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
  .file-input-label {
    display: inline-block; margin-top: 10px; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--hairline); font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink);
  }
  .file-input-label:hover { border-color: var(--accent); color: var(--accent); }
  .file-input-label input { display: none; }

  .preview-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .preview-panel { width: 100%; height: 100%; max-width: 1400px; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .preview-panel-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--hairline); background: var(--surface); }
  .preview-panel-bar span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .preview-panel iframe { flex: 1; width: 100%; border: 0; }
  .preview-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--hairline); background: var(--canvas); font-size: 14px; }

  .posts-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .posts-toolbar input[type="text"] { width: auto; flex: 1; min-width: 160px; }
  .posts-toolbar select { border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 13px; background: var(--canvas); }
  .btn-new-post { background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 11px 18px; border-radius: 10px; white-space: nowrap; }
  .posts-table { width: 100%; border-collapse: collapse; background: var(--canvas); border: 1px solid var(--hairline); border-radius: 14px; overflow: hidden; font-size: 13px; }
  .posts-table th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--hairline); background: var(--surface); }
  .posts-table td { padding: 12px 14px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
  .posts-table tr:last-child td { border-bottom: 0; }
  .posts-table .post-title-cell { font-weight: 700; }
  .posts-table .post-title-cell a { color: var(--accent); }
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .status-badge.published { background: #dcfce7; color: #15803d; }
  .status-badge.draft { background: #f1f5f9; color: #64748b; }
  .status-badge.scheduled { background: #fef9c3; color: #a16207; }
  .row-actions { display: flex; gap: 10px; }
  .row-actions button { background: transparent; color: var(--accent); font-weight: 700; font-size: 12px; padding: 0; }
  .row-actions button.danger { color: #dc2626; }
  .bulk-bar { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .bulk-bar button { background: rgba(255,255,255,.12); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .bulk-bar button.danger { background: #dc2626; }
  .posts-empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  .editor-back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; font-size: 13px; margin-bottom: 18px; background: none; }
  .editor-grid { display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
  .editor-side .group { margin-bottom: 18px; }
  .slug-preview { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .slug-preview code { background: var(--surface); padding: 2px 6px; border-radius: 5px; }
  .cover-preview { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); margin-bottom: 10px; }
  .editor-actions { display: flex; flex-direction: column; gap: 10px; }
  .editor-actions button { padding: 11px; border-radius: 10px; font-weight: 700; font-size: 13px; }
  .btn-draft { background: var(--surface); border: 1px solid var(--hairline); color: var(--ink); }
  .btn-publish { background: var(--accent); color: #fff; }
  .btn-delete-post { background: transparent; color: #dc2626; border: 1px solid #fecaca; }
  .schedule-row { display: flex; gap: 8px; }
  .schedule-row input { flex: 1; }
  .schedule-row button { white-space: nowrap; background: var(--surface); border: 1px solid var(--hairline); color: var(--ink); padding: 0 14px; border-radius: 10px; font-weight: 700; font-size: 12px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-card { background: var(--canvas); border-radius: 16px; padding: 26px; max-width: 380px; width: 100%; }
  .modal-card h3 { margin: 0 0 10px; font-size: 16px; }
  .modal-card p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button { padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; }
  .modal-cancel { background: var(--surface); border: 1px solid var(--hairline); color: var(--ink); }
  .modal-confirm { background: #dc2626; color: #fff; }
  @media (max-width: 800px) {
    .editor-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div id="loginView" class="login-wrap hidden">
    <div class="login-card">
      <h1>Content Admin</h1>
      <p>Sign in to edit the site's text content.</p>
      <form id="loginForm">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button class="btn-primary" style="margin-top:18px" type="submit" id="loginBtn">Sign In</button>
        <p class="error" id="loginError"></p>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="bar">
      <div>
        <strong>Content Admin</strong>
        <div class="sub">Edits save straight to the live site.</div>
      </div>
      <div class="bar-actions">
        <button class="btn-ghost" id="previewBtn" type="button">Preview</button>
        <button class="btn-save" id="saveBtn" type="button">Save Changes</button>
        <button class="btn-ghost" id="logoutBtn" type="button">Log Out</button>
      </div>
    </div>
    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="main">
        <div class="main-inner">
          <div id="loadingMsg" class="loading">Loading content…</div>
          <div id="formGroups"></div>
          <div id="imagesPanel" class="hidden"></div>
          <div id="postsPanel" class="hidden"></div>
          <div id="pagesPanel" class="hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-banner" id="statusBanner"></div>

<script>
(function () {
  var data = null; // { values, fields, imageFields, siteOrigin, rawFiles }
  var originalValues = {};
  var controllers = {}; // fieldId -> { getValue() }
  var pages = [];
  var currentPage = null;

  var PAGE_URL_PREFIX = {
    'index.html': '',
    'best-seo-expert-in-nepal/index.html': 'best-seo-expert-in-nepal/',
    'blog/index.html': 'blog/',
    'what-is-seo-and-how-does-it-work/index.html': 'what-is-seo-and-how-does-it-work/',
  };

  var loginView = document.getElementById('loginView');
  var appView = document.getElementById('appView');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var loginBtn = document.getElementById('loginBtn');
  var sidebar = document.getElementById('sidebar');
  var formGroups = document.getElementById('formGroups');
  var imagesPanel = document.getElementById('imagesPanel');
  var postsPanel = document.getElementById('postsPanel');
  var pagesPanel = document.getElementById('pagesPanel');
  var loadingMsg = document.getElementById('loadingMsg');
  var saveBtn = document.getElementById('saveBtn');
  var previewBtn = document.getElementById('previewBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  var statusBanner = document.getElementById('statusBanner');

  function showBanner(text, isError) {
    statusBanner.textContent = text;
    statusBanner.classList.toggle('error-banner', !!isError);
    statusBanner.classList.add('show');
    setTimeout(function () { statusBanner.classList.remove('show'); }, 3200);
  }

  function showLogin(message) {
    appView.classList.add('hidden');
    loginView.classList.remove('hidden');
    loginError.textContent = message || '';
  }

  function showApp() {
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function unescapeHtml(s) {
    return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  }

  // ---- Repeater parsers/serializers ----

  function parseProcessSteps(html) {
    var re = /<article class="process-step">\s*<h3>([\s\S]*?)<\/h3>\s*<p>([\s\S]*?)<\/p>\s*<\/article>/g;
    var items = []; var m;
    while ((m = re.exec(html || ''))) items.push({ title: unescapeHtml(m[1].trim()), desc: unescapeHtml(m[2].trim()) });
    return items;
  }
  function serializeProcessSteps(items) {
    return items.map(function (it) {
      return '<article class="process-step"><h3>' + escapeHtml(it.title) + '</h3><p>' + escapeHtml(it.desc) + '</p></article>';
    }).join('\n          ');
  }

  function parseFaqList(html) {
    var re = /<details class="faq-item">\s*<summary>([\s\S]*?)<\/summary>\s*<p>([\s\S]*?)<\/p>\s*<\/details>/g;
    var items = []; var m;
    while ((m = re.exec(html || ''))) items.push({ q: unescapeHtml(m[1].trim()), a: unescapeHtml(m[2].trim()) });
    return items;
  }
  function serializeFaqList(items) {
    return items.map(function (it) {
      return '<details class="faq-item">\n            <summary>' + escapeHtml(it.q) + '</summary>\n            <p>' + escapeHtml(it.a) + '</p>\n          </details>';
    }).join('\n          ');
  }

  function parseCards(html) {
    var re = /<article class="service-card"><span class="service-num">\d+<\/span><h3>([\s\S]*?)<\/h3><p>([\s\S]*?)<\/p><\/article>/g;
    var items = []; var m;
    while ((m = re.exec(html || ''))) items.push({ title: unescapeHtml(m[1].trim()), desc: unescapeHtml(m[2].trim()) });
    return items;
  }
  function serializeCards(items) {
    return items.map(function (it, idx) {
      var num = String(idx + 1).length < 2 ? '0' + (idx + 1) : String(idx + 1);
      return '<article class="service-card"><span class="service-num">' + num + '</span><h3>' + escapeHtml(it.title) + '</h3><p>' + escapeHtml(it.desc) + '</p></article>';
    }).join('\n          ');
  }

  var CHECK_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  function parseChecklist(html) {
    var re = /<li><span class="check-icon">[\s\S]*?<\/span><span><strong>([\s\S]*?)<\/strong>\s*([\s\S]*?)<\/span><\/li>/g;
    var items = []; var m;
    while ((m = re.exec(html || ''))) items.push({ label: unescapeHtml(m[1].trim()), text: unescapeHtml(m[2].trim()) });
    return items;
  }
  function serializeChecklist(items) {
    return items.map(function (it) {
      return '<li><span class="check-icon">' + CHECK_ICON_SVG + '</span><span><strong>' + escapeHtml(it.label) + '</strong> ' + escapeHtml(it.text) + '</span></li>';
    }).join('\n              ');
  }

  // ---- Live preview: client port of the server-side marker apply logic ----

  var ATTR_MARKER_RE = /<!--cms-attr:([a-zA-Z0-9_-]+):([a-zA-Z0-9_-]+):([a-zA-Z0-9_-]+)-->/g;
  var TEXT_EL_MARKER_RE = /<!--cms-text:([a-zA-Z0-9_-]+)-->/g;
  function applyTransform(name, value) {
    switch (name) {
      case 'mailto': return 'mailto:' + value;
      case 'tel': return 'tel:' + String(value).replace(/\s+/g, '');
      case 'wa': return 'https://wa.me/' + String(value).replace(/[^\d]/g, '');
      default: return value;
    }
  }
  function escapeAttrValue(value) {
    return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }
  function applyFieldsToRaw(content, values) {
    var next = content;
    Object.keys(values).forEach(function (id) {
      var re = new RegExp('(<!--cms:' + id + '-->)([\\s\\S]*?)(<!--cms:\\/' + id + '-->)', 'g');
      next = next.replace(re, function (_m, open, _old, close) { return open + values[id] + close; });
    });
    var triples = {};
    var m;
    ATTR_MARKER_RE.lastIndex = 0;
    while ((m = ATTR_MARKER_RE.exec(next))) triples[m[1] + '|' + m[2] + '|' + m[3]] = true;
    Object.keys(triples).forEach(function (key) {
      var parts = key.split('|');
      var id = parts[0], attr = parts[1], transformName = parts[2];
      if (!(id in values)) return;
      var transformed = applyTransform(transformName, values[id]);
      var re = new RegExp('(<!--cms-attr:' + id + ':' + attr + ':' + transformName + '-->\\s*<[a-zA-Z0-9]+\\b[^>]*?\\s' + attr + '=")([^"]*)("[^>]*>)', 'g');
      next = next.replace(re, function (_m, pre, _old, post) { return pre + escapeAttrValue(transformed) + post; });
    });
    var textElIds = {};
    TEXT_EL_MARKER_RE.lastIndex = 0;
    while ((m = TEXT_EL_MARKER_RE.exec(next))) textElIds[m[1]] = true;
    Object.keys(textElIds).forEach(function (id) {
      if (!(id in values)) return;
      var re2 = new RegExp('(<!--cms-text:' + id + '-->\\s*<[a-zA-Z0-9]+[^>]*>)([\\s\\S]*?)(<\\/[a-zA-Z0-9]+>)', 'g');
      next = next.replace(re2, function (_m, pre, _old, post) { return pre + values[id] + post; });
    });
    return next;
  }

  var previewOverlay = null;
  var previewIframe = null;
  var previewTimer = null;

  function currentPageFile() {
    var f = data.fields.filter(function (f) { return f.page === currentPage; })[0];
    return f ? f.file : null;
  }

  function buildPreviewDoc() {
    var file = currentPageFile();
    if (!file || !data.rawFiles[file]) return '<p style="font-family:sans-serif;padding:40px">Preview unavailable for this page.</p>';
    var valuesForFile = {};
    data.fields.filter(function (f) { return f.file === file; }).forEach(function (f) {
      var ctrl = controllers[f.id];
      if (ctrl) valuesForFile[f.id] = ctrl.getValue();
    });
    var applied = applyFieldsToRaw(data.rawFiles[file], valuesForFile);
    var prefix = data.siteOrigin + '/' + (PAGE_URL_PREFIX[file] || '');
    var baseTag = '<base href="' + prefix + '">';
    return applied.replace(/<head(\s[^>]*)?>/i, function (m) { return m + baseTag; });
  }

  function schedulePreviewUpdate() {
    if (!previewOverlay) return;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function () {
      if (previewIframe) previewIframe.srcdoc = buildPreviewDoc();
    }, 450);
  }

  function openPreview() {
    if (currentPage === 'Images') { showBanner('Pick a page to preview first.'); return; }

  // ---- Field builders ----

  function buildRepeater(wrap, items, itemLabels, addLabel) {
    var listEl = document.createElement('div');
    wrap.appendChild(listEl);

    function renderList() {
      listEl.innerHTML = '';
      items.forEach(function (item, idx) {
        var card = document.createElement('div');
        card.className = 'repeater-item';

        var removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-item';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', function () {
          items.splice(idx, 1);
          renderList();
          schedulePreviewUpdate();
        });
        card.appendChild(removeBtn);

        itemLabels.forEach(function (fieldDef) {
          var sub = document.createElement('div');
          sub.className = 'subfield';
          var lbl = document.createElement('label');
          lbl.textContent = fieldDef.label;
          sub.appendChild(lbl);
          var input = fieldDef.multiline ? document.createElement('textarea') : document.createElement('input');
          if (!fieldDef.multiline) input.type = 'text';
          input.value = item[fieldDef.key] || '';
          input.addEventListener('input', function () { item[fieldDef.key] = input.value; });
          sub.appendChild(input);
          card.appendChild(sub);
        });

        listEl.appendChild(card);
      });
    }

    var addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-item-btn';
    addBtn.textContent = addLabel;
    addBtn.addEventListener('click', function () {
      var blank = {};
      itemLabels.forEach(function (f) { blank[f.key] = ''; });
      items.push(blank);
      renderList();
      schedulePreviewUpdate();
    });
    wrap.appendChild(addBtn);

    renderList();
  }

  function buildRichText(wrap, initialHtml, expanded) {
    var toolbar = document.createElement('div');
    toolbar.className = 'richtext-toolbar';

    function addBtn(label, className, cmd, arg) {
      var b = document.createElement('button');
      b.type = 'button';
      if (className) b.className = className;
      b.textContent = label;
      b.addEventListener('mousedown', function (e) {
        e.preventDefault();
        document.execCommand(cmd, false, arg);
        box.dispatchEvent(new Event('input', { bubbles: true }));
      });
      toolbar.appendChild(b);
    }

    addBtn('B', '', 'bold');
    addBtn('I', 'italic-btn', 'italic');
    if (expanded) {
      addBtn('H2', '', 'formatBlock', 'h2');
      addBtn('H3', '', 'formatBlock', 'h3');
      addBtn('¶', '', 'formatBlock', 'p');
      addBtn('• List', '', 'insertUnorderedList');
      addBtn('1. List', '', 'insertOrderedList');
    }
    wrap.appendChild(toolbar);

    var box = document.createElement('div');
    box.className = 'richtext-box' + (expanded ? ' large' : '');
    box.contentEditable = 'true';
    box.innerHTML = initialHtml || '';
    wrap.appendChild(box);

    box.addEventListener('focus', function () {
      document.execCommand('defaultParagraphSeparator', false, 'p');
    });

    return box;
  }

  function fieldInputId(id) { return 'field-' + id; }

  function buildField(f, wrap) {
    if (f.type === 'text' || f.type === 'textarea') {
      var label = document.createElement('label');
      label.setAttribute('for', fieldInputId(f.id));
      label.textContent = f.label;
      wrap.appendChild(label);

      var input = f.type === 'text' ? document.createElement('input') : document.createElement('textarea');
      if (f.type === 'text') input.type = 'text';
      input.id = fieldInputId(f.id);
      input.value = data.values[f.id] || '';
      wrap.appendChild(input);
      controllers[f.id] = { getValue: function () { return input.value; } };

    } else if (f.type === 'richtext' || f.type === 'richtext-full') {
      var rtLabel = document.createElement('label');
      rtLabel.textContent = f.label;
      wrap.appendChild(rtLabel);
      var box = buildRichText(wrap, data.values[f.id] || '', f.type === 'richtext-full');
      controllers[f.id] = { getValue: function () { return box.innerHTML; } };

    } else if (f.type === 'repeater-steps') {
      var stepsLabel = document.createElement('label');
      stepsLabel.textContent = f.label;
      wrap.appendChild(stepsLabel);
      var stepItems = parseProcessSteps(data.values[f.id]);
      buildRepeater(wrap, stepItems, [{ key: 'title', label: 'Title' }, { key: 'desc', label: 'Description', multiline: true }], '+ Add Step');
      controllers[f.id] = { getValue: function () { return serializeProcessSteps(stepItems); } };

    } else if (f.type === 'repeater-faq') {
      var faqLabel = document.createElement('label');
      faqLabel.textContent = f.label;
      wrap.appendChild(faqLabel);
      var faqItems = parseFaqList(data.values[f.id]);
      buildRepeater(wrap, faqItems, [{ key: 'q', label: 'Question' }, { key: 'a', label: 'Answer', multiline: true }], '+ Add FAQ');
      controllers[f.id] = { getValue: function () { return serializeFaqList(faqItems); } };

    } else if (f.type === 'repeater-cards') {
      var cardsLabel = document.createElement('label');
      cardsLabel.textContent = f.label;
      wrap.appendChild(cardsLabel);
      var cardItems = parseCards(data.values[f.id]);
      buildRepeater(wrap, cardItems, [{ key: 'title', label: 'Title' }, { key: 'desc', label: 'Description', multiline: true }], '+ Add Card');
      controllers[f.id] = { getValue: function () { return serializeCards(cardItems); } };

    } else if (f.type === 'repeater-checklist') {
      var checkLabel = document.createElement('label');
      checkLabel.textContent = f.label;
      wrap.appendChild(checkLabel);
      var checkItems = parseChecklist(data.values[f.id]);
      buildRepeater(wrap, checkItems, [{ key: 'label', label: 'Lead-in (bold)' }, { key: 'text', label: 'Rest of the sentence', multiline: true }], '+ Add Item');
      controllers[f.id] = { getValue: function () { return serializeChecklist(checkItems); } };
    }
  }

  function renderPageForm(pageName) {
    formGroups.innerHTML = '';
    var pageFields = data.fields.filter(function (f) { return f.page === pageName; });
    var groups = {};
    var order = [];
    pageFields.forEach(function (f) {
      if (!groups[f.group]) { groups[f.group] = []; order.push(f.group); }
      groups[f.group].push(f);
    });
    order.forEach(function (groupName) {
      var section = document.createElement('div');
      section.className = 'group';
      var h2 = document.createElement('h2');
      h2.textContent = groupName;
      section.appendChild(h2);
      groups[groupName].forEach(function (f) {
        var wrap = document.createElement('div');
        wrap.className = 'field';
        buildField(f, wrap);
        section.appendChild(wrap);
      });
      formGroups.appendChild(section);
    });
  }

  function uploadImage(field, file, statusEl, imgEl) {
    if (file.size > 4 * 1024 * 1024) {
      statusEl.textContent = 'File is too large (max 4MB).';
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      statusEl.textContent = 'Uploading…';
      fetch('/api/upload-image', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: field.id, dataUrl: reader.result }),
      })
        .then(function (res) {
          if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
          return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Upload failed.'); return d; });
        })
        .then(function () {
          statusEl.textContent = 'Saved — the site will redeploy in a minute or two.';
          imgEl.src = field.url.split('?')[0] + '?t=' + Date.now();
        })
        .catch(function (err) {
          if (err.message !== 'unauthenticated') statusEl.textContent = err.message;
        });
    };
    reader.readAsDataURL(file);
  }

  function renderImagesPanel() {
    imagesPanel.innerHTML = '';
    var groups = {};
    var order = [];
    data.imageFields.forEach(function (f) {
      if (!groups[f.group]) { groups[f.group] = []; order.push(f.group); }
      groups[f.group].push(f);
    });
    order.forEach(function (groupName) {
      var section = document.createElement('div');
      section.className = 'group';
      var h2 = document.createElement('h2');
      h2.textContent = groupName;
      section.appendChild(h2);

      groups[groupName].forEach(function (f) {
        var card = document.createElement('div');
        card.className = 'field image-card';

        var img = document.createElement('img');
        img.src = f.url;
        img.alt = f.label;
        card.appendChild(img);

        var meta = document.createElement('div');
        meta.className = 'image-meta';
        var lbl = document.createElement('label');
        lbl.textContent = f.label;
        meta.appendChild(lbl);

        var fileLabel = document.createElement('label');
        fileLabel.className = 'file-input-label';
        fileLabel.textContent = 'Replace Image';
        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileLabel.appendChild(fileInput);
        meta.appendChild(fileLabel);

        var status = document.createElement('div');

        fileInput.addEventListener('change', function () {

        });

        card.appendChild(meta);
        section.appendChild(card);

      imagesPanel.appendChild(section);
    });
  }

  // ---- Blog Posts panel ----
  var postsData = [];
  var postsView = 'list';
  var editingPost = null;
  var selectedSlugs = {};

  function slugifyClient(input) {
    return String(input).toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function statusBadgeEl(status) {
    var span = document.createElement('span');
    span.className = 'status-badge ' + status;
    span.textContent = status;
    return span;
  }

  function confirmModal(title, message, onConfirm) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var card = document.createElement('div');
    card.className = 'modal-card';
    var h3 = document.createElement('h3'); h3.textContent = title;
    var p = document.createElement('p'); p.textContent = message;
    var actions = document.createElement('div'); actions.className = 'modal-actions';
    var cancelBtn = document.createElement('button'); cancelBtn.type = 'button'; cancelBtn.className = 'modal-cancel'; cancelBtn.textContent = 'Cancel';
    var confirmBtn = document.createElement('button'); confirmBtn.type = 'button'; confirmBtn.className = 'modal-confirm'; confirmBtn.textContent = 'Delete';
    cancelBtn.addEventListener('click', function () { overlay.remove(); });
    confirmBtn.addEventListener('click', function () { overlay.remove(); onConfirm(); });
    actions.appendChild(cancelBtn); actions.appendChild(confirmBtn);
    card.appendChild(h3); card.appendChild(p); card.appendChild(actions);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  function loadPostsList() {
    postsPanel.innerHTML = '<div class="loading">Loading posts…</div>';
    fetch('/api/posts?op=list', { credentials: 'same-origin' })
      .then(function (res) {
        if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
        return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Failed to load posts.'); return d; });
      })
      .then(function (d) {
        postsData = d.posts || [];
        postsView = 'list';
        renderPostsPanel();
      })
      .catch(function (err) {
        if (err.message !== 'unauthenticated') postsPanel.innerHTML = '<div class="loading">' + err.message + '</div>';
      });
  }

  function renderPostsPanel() {
    if (postsView === 'editor') { renderPostEditor(editingPost); return; }
    renderPostsListView();
  }

  function renderPostsListView() {
    postsPanel.innerHTML = '';
    selectedSlugs = {};

    var toolbar = document.createElement('div');
    toolbar.className = 'posts-toolbar';
    var search = document.createElement('input');
    search.type = 'text';
    search.placeholder = 'Search posts…';
    var catSelect = document.createElement('select');
    var categories = Array.prototype.filter.call(
      postsData.map(function (p) { return p.category; }).filter(Boolean).filter(function (c, i, arr) { return arr.indexOf(c) === i; }),
      function () { return true; }
    );
    var allOpt = document.createElement('option'); allOpt.value = ''; allOpt.textContent = 'All categories';
    catSelect.appendChild(allOpt);
    categories.forEach(function (c) { var o = document.createElement('option'); o.value = c; o.textContent = c; catSelect.appendChild(o); });
    var newBtn = document.createElement('button');
    newBtn.type = 'button'; newBtn.className = 'btn-new-post'; newBtn.textContent = '+ New Post';
    newBtn.addEventListener('click', function () { editingPost = null; postsView = 'editor'; renderPostsPanel(); });
    toolbar.appendChild(search); toolbar.appendChild(catSelect); toolbar.appendChild(newBtn);
    postsPanel.appendChild(toolbar);

    var bulkBar = document.createElement('div');
    bulkBar.className = 'bulk-bar hidden';
    postsPanel.appendChild(bulkBar);

    var tableWrap = document.createElement('div');
    postsPanel.appendChild(tableWrap);

    function applyFilters() {
      var term = search.value.trim().toLowerCase();
      var cat = catSelect.value;
      return postsData.filter(function (p) {
        if (cat && p.category !== cat) return false;
        if (term && p.title.toLowerCase().indexOf(term) === -1) return false;
        return true;
      }).slice().sort(function (a, b) { return new Date(b.updatedAt || b.publishDate || 0) - new Date(a.updatedAt || a.publishDate || 0); });
    }

    function runBulkAction(action) {
      var slugs = Object.keys(selectedSlugs).filter(function (k) { return selectedSlugs[k]; });
      fetch('/api/posts?op=bulk', {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slugs: slugs, action: action }),
      })
        .then(function (res) {
          if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
          return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Bulk action failed.'); return d; });
        })
        .then(function () { showBanner('Done.'); loadPostsList(); })
        .catch(function (err) { if (err.message !== 'unauthenticated') showBanner(err.message, true); });
    }

    function updateBulkBar() {
      var count = Object.keys(selectedSlugs).filter(function (k) { return selectedSlugs[k]; }).length;
      if (count === 0) { bulkBar.classList.add('hidden'); bulkBar.innerHTML = ''; return; }
      bulkBar.classList.remove('hidden');
      bulkBar.innerHTML = '';
      var label = document.createElement('span'); label.textContent = count + ' selected';
      var pubBtn = document.createElement('button'); pubBtn.type = 'button'; pubBtn.textContent = 'Publish';
      var unpubBtn = document.createElement('button'); unpubBtn.type = 'button'; unpubBtn.textContent = 'Unpublish';
      var delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.className = 'danger'; delBtn.textContent = 'Delete';
      pubBtn.addEventListener('click', function () { runBulkAction('publish'); });
      unpubBtn.addEventListener('click', function () { runBulkAction('unpublish'); });
      delBtn.addEventListener('click', function () {
        confirmModal('Delete ' + count + ' post(s)?', 'This removes their live pages and cannot be undone.', function () { runBulkAction('delete'); });
      });
      bulkBar.appendChild(label); bulkBar.appendChild(pubBtn); bulkBar.appendChild(unpubBtn); bulkBar.appendChild(delBtn);
    }

    function drawTable() {
      var list = applyFilters();
      tableWrap.innerHTML = '';
      if (!list.length) {
        var empty = document.createElement('p');
        empty.className = 'posts-empty';
        empty.textContent = postsData.length ? 'No posts match your filters.' : 'No posts yet — click "+ New Post" to write your first one.';
        tableWrap.appendChild(empty);
        return;
      }
      var table = document.createElement('table');
      table.className = 'posts-table';
      table.innerHTML = '<thead><tr><th></th><th>Title</th><th>Status</th><th>Category</th><th>Updated</th><th></th></tr></thead>';
      var tbody = document.createElement('tbody');
      list.forEach(function (p) {
        var tr = document.createElement('tr');

        var checkTd = document.createElement('td');
        if (!p.external) {
          var check = document.createElement('input');
          check.type = 'checkbox';
          check.checked = !!selectedSlugs[p.slug];
          check.addEventListener('change', function () { selectedSlugs[p.slug] = check.checked; updateBulkBar(); });
          checkTd.appendChild(check);
        }
        tr.appendChild(checkTd);

        var titleTd = document.createElement('td');
        titleTd.className = 'post-title-cell';
        if (p.status === 'published') {
          var link = document.createElement('a');
          link.href = p.url; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = p.title;
          titleTd.appendChild(link);
        } else {
          titleTd.textContent = p.title;
        }
        if (p.external) {
          var badge = document.createElement('span');
          badge.style.cssText = 'margin-left:8px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;';
          badge.textContent = '(legacy page)';
          titleTd.appendChild(badge);
        }
        tr.appendChild(titleTd);

        var statusTd = document.createElement('td');
        statusTd.appendChild(statusBadgeEl(p.status));
        tr.appendChild(statusTd);

        var catTd = document.createElement('td');
        catTd.textContent = p.category || '—';
        tr.appendChild(catTd);

        var dateTd = document.createElement('td');
        dateTd.textContent = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString() : '—';
        tr.appendChild(dateTd);

        var actionsTd = document.createElement('td');
        var actionsWrap = document.createElement('div');
        actionsWrap.className = 'row-actions';
        if (!p.external) {
          var editBtn = document.createElement('button');
          editBtn.type = 'button'; editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', function () { editingPost = p; postsView = 'editor'; renderPostsPanel(); });
          var rowDelBtn = document.createElement('button');
          rowDelBtn.type = 'button'; rowDelBtn.className = 'danger'; rowDelBtn.textContent = 'Delete';
          rowDelBtn.addEventListener('click', function () {
            confirmModal('Delete this post?', 'This removes its live page and cannot be undone.', function () {
              fetch('/api/posts?op=delete', {
                method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug: p.slug }),
              })
                .then(function (res) {
                  if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
                  return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Delete failed.'); return d; });
                })
                .then(function () { showBanner('Post deleted.'); loadPostsList(); })
                .catch(function (err) { if (err.message !== 'unauthenticated') showBanner(err.message, true); });
            });
          });
          actionsWrap.appendChild(editBtn); actionsWrap.appendChild(rowDelBtn);
        } else {
          var note = document.createElement('span');
          note.style.cssText = 'font-size:12px;color:var(--muted)';
          note.textContent = 'Edit via Article page';
          actionsWrap.appendChild(note);
        }
        actionsTd.appendChild(actionsWrap);
        tr.appendChild(actionsTd);

        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableWrap.appendChild(table);
    }

    search.addEventListener('input', drawTable);
    catSelect.addEventListener('change', drawTable);
    drawTable();
    updateBulkBar();
  }

  function selectPage(pageName) {
    currentPage = pageName;
    Array.prototype.forEach.call(sidebar.querySelectorAll('button'), function (b) {
      b.classList.toggle('active', b.dataset.page === pageName);
    });
    formGroups.classList.add('hidden');
    imagesPanel.classList.add('hidden');
    postsPanel.classList.add('hidden');
    pagesPanel.classList.add('hidden');
    previewBtn.style.display = 'none';
    if (pageName === 'Images') {
      imagesPanel.classList.remove('hidden');
    } else if (pageName === 'Blog Posts') {
      postsPanel.classList.remove('hidden');
      loadPostsList();
    } else if (pageName === 'Pages') {
      pagesPanel.classList.remove('hidden');
      loadPagesList();
    } else {
      formGroups.classList.remove('hidden');
      previewBtn.style.display = '';
      renderPageForm(pageName);
    }
  }

  function renderSidebar() {
    sidebar.innerHTML = '';
    pages.forEach(function (pageName) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = pageName;
      btn.dataset.page = pageName;
      btn.addEventListener('click', function () { selectPage(pageName); });
      sidebar.appendChild(btn);
    });
  }

  function render(payload) {
    data = payload;
    originalValues = Object.assign({}, payload.values);
    controllers = {};

    pages = [];
    payload.fields.forEach(function (f) {
      if (pages.indexOf(f.page) === -1) pages.push(f.page);
    });
    pages.push('Blog Posts');
    pages.push('Pages');
    if (payload.imageFields && payload.imageFields.length) pages.push('Images');

    renderSidebar();
    renderImagesPanel();
    loadingMsg.classList.add('hidden');
    selectPage(pages[0]);
  }

  function collectChangedValues() {
    var changed = {};
    data.fields.forEach(function (f) {
      var ctrl = controllers[f.id];
      if (!ctrl) return;
      var val = ctrl.getValue();
      if (val !== (originalValues[f.id] || '')) changed[f.id] = val;
    });
    return changed;
  }

  function loadContent() {
    loadingMsg.classList.remove('hidden');
    loadingMsg.textContent = 'Loading content…';
    formGroups.innerHTML = '';
    sidebar.innerHTML = '';
    fetch('/api/content', { credentials: 'same-origin' })
      .then(function (res) {
        if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
        if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || 'Failed to load content.'); });
        return res.json();
      })
      .then(function (payload) {
        showApp();
        render(payload);
      })
      .catch(function (err) {
        if (err.message !== 'unauthenticated') {
          loadingMsg.textContent = 'Failed to load content: ' + err.message;
        }
      });
  }

  loginForm.addEventListener('submit', function (e) {

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    var password = document.getElementById('password').value;
    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password }),
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
      .then(function (r) {
        if (!r.ok) { loginError.textContent = r.data.error || 'Login failed.'; return; }
        document.getElementById('password').value = '';
        loadContent();
      })
      .catch(function () { loginError.textContent = 'Network error, please try again.'; })
      .finally(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';

      closePreview();
      showLogin();
    });
  });

  saveBtn.addEventListener('click', function () {
    var changed = collectChangedValues();
    if (Object.keys(changed).length === 0) {
      showBanner('No changes to save.');
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    fetch('/api/save', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: changed }),
    })
      .then(function (res) {
        if (res.status === 401) { showLogin(); throw new Error('unauthenticated'); }
        return res.json().then(function (d) { if (!res.ok) throw new Error(d.error || 'Save failed.'); return d; });
      })
      .then(function () {
        Object.keys(changed).forEach(function (id) { originalValues[id] = changed[id]; });
        showBanner('Saved. The site will redeploy in a minute or two.');
      })
      .catch(function (err) {
        if (err.message !== 'unauthenticated') showBanner(err.message, true);
      })
      .finally(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      });
  });

  loadContent();
})();
</script>
</body>
</html>
