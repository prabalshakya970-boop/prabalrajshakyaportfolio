<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Prabal Raj Shakya</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #2563eb; --navy: #1c2a6b; --ink: #0f172a; --muted: #475569; --hairline: #e5e7eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #eaf6fc; color: var(--ink); text-align: center; padding: 24px;
      font-family: Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .card { max-width: 460px; }
    .code { font-size: 15px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: clamp(30px, 5vw, 42px); font-weight: 800; letter-spacing: -0.02em; color: var(--navy); margin: 10px 0 14px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 26px; border-radius: 10px; font-weight: 700; font-size: 14px; border: 2px solid var(--navy); }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-outline { background: transparent; color: var(--navy); }
  </style>
</head>
<body>
  <div class="card">
    <span class="code">404</span>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist or may have moved. Try heading back home or browsing the blog.</p>
    <div class="actions">
      <a class="btn btn-navy" href="/">Go Home</a>
      <a class="btn btn-outline" href="/blog/">Visit Blog</a>
    </div>
  </div>
</body>
</html>
